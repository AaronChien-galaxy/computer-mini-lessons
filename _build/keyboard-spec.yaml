schema_version: "soil_interactive_deck_v1"

deck:
  title: "電腦小知識：中英文切換與功能鍵"
  audience: "國小三年級電腦課"
  purpose: "會切換中英文、打大寫、認識 Shift／Caps Lock／Enter"
  takeaway: "按一下 Shift 切中英文；按住 Shift 打大寫"
  language: "zh-TW"
  slide_count: 11
  output: "slides.html"
  portability: "single_file"

canvas:
  target_ratio: "16:9"
  responsive: true
  narrow_breakpoint_px: 900
  allow_active_slide_scroll: true

soil_flow:
  sequence: [hook, attention, action]

design_system:
  style_id: "warm_keycap_v1"
  palette: {background: "#FFF8EC", primary: "#1F6F8B", accent: "#F28C38", text: "#1E2A33"}
  fixed_shell: {title_anchor: "top_left", progress: true, phase_label: true, page_number: true}
  typography:
    font_feel: "粗圓、飽滿、低稜角、柔和端點"
    avoid: "尖角、窄長、機械感、科技模板字"
  motion: {duration_ms: 420, reduced_motion_fallback: true}

layout_router:
  allowed: [cover_hero, question_focus, misconception_dual, comparison_split, process_timeline, classification_grid, case_scene_analysis, relationship_map, data_focus, summary_three, action_next_step, section_divider]

interaction_router:
  allowed: [none, reveal, toggle_compare, stepper, filter_cards, tabs, decision_tree, sortable_table, chart, hotspot, slider, quiz, drag_match]
  min_interactive_slides: 2
  max_primary_interactions_per_slide: 1

validation:
  strict_offline: true
  require_keyboard: true
  require_touch: true
  require_reduced_motion: true
  require_static_fallback: true

slides:
  - page: 1
    soil_phase: "hook"
    role: "cover"
    learning_task: "知道今天要學什麼"
    core_point: "打字會變怪字，是因為輸入法模式"
    semantic_structure: "focus"
    layout: {id: "cover_hero", variant: "left_title"}
    visible_text: {title: "打字怎麼變成怪怪的字？"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "none", goal: "", trigger: "click", initial_state: "cover", states: [], fallback: "static cover"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 2
    soil_phase: "hook"
    role: "practice"
    learning_task: "判斷鍵盤使用規矩"
    core_point: "輕按、不拍、不吃東西、不按著不放"
    semantic_structure: "practice"
    layout: {id: "question_focus", variant: "quiz"}
    visible_text: {title: "這樣可以嗎？"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "quiz", goal: "判斷哪些行為可以", trigger: "click", initial_state: "question_1", states: [r1, r2, r3, r4], fallback: "四個情境與解答直接列出"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 3
    soil_phase: "attention"
    role: "comparison"
    learning_task: "比較中文與英文模式"
    core_point: "按 Shift 切換"
    semantic_structure: "contrast"
    layout: {id: "comparison_split", variant: "interactive_toggle"}
    visible_text: {title: "打 a b c，會出現什麼？"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "toggle_compare", goal: "看見兩種模式的差別", trigger: "click", initial_state: "overview", states: [zh, en], fallback: "兩個面板並排顯示"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 4
    soil_phase: "attention"
    role: "practice"
    learning_task: "判斷大寫的按法"
    core_point: "Shift 與 Caps Lock 的差別"
    semantic_structure: "practice"
    layout: {id: "question_focus", variant: "quiz"}
    visible_text: {title: "怎麼按才對？"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "quiz", goal: "判斷大寫的按法", trigger: "click", initial_state: "question_1", states: [q1, q2, q3], fallback: "三題答案直接列出"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 5
    soil_phase: "attention"
    role: "hierarchy"
    learning_task: "認識功能鍵"
    core_point: "每個鍵各有作用"
    semantic_structure: "hierarchy"
    layout: {id: "relationship_map", variant: "keyboard_hotspot"}
    visible_text: {title: "按一個鍵，看它做什麼"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "hotspot", goal: "認識功能鍵作用", trigger: "click", initial_state: "idle", states: [shift, capslock, enter, backspace, space], fallback: "按鍵說明文字列出"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 6
    soil_phase: "attention"
    role: "hierarchy"
    learning_task: "知道手指放哪裡"
    core_point: "食指回家，摸 F 和 J 的突起"
    semantic_structure: "hierarchy"
    layout: {id: "relationship_map", variant: "finger_tabs"}
    visible_text: {title: "手指「回家」的位置"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "tabs", goal: "記得手指擺位", trigger: "click", initial_state: "idle", states: [left, right, bumps], fallback: "手指擺位文字直接列出"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 7
    soil_phase: "attention"
    role: "comparison"
    learning_task: "知道數字鍵上的符號"
    core_point: "Shift＋2 是 @"
    semantic_structure: "contrast"
    layout: {id: "comparison_split", variant: "number_row_toggle"}
    visible_text: {title: "按住 Shift，數字變符號"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "toggle_compare", goal: "認識數字鍵與符號的對應", trigger: "click", initial_state: "numbers", states: [numbers, symbols], fallback: "符號對照直接列出"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 8
    soil_phase: "attention"
    role: "practice"
    learning_task: "用 Ctrl 組合鍵複製貼上"
    core_point: "選起來再複製"
    semantic_structure: "hierarchy"
    layout: {id: "relationship_map", variant: "ctrl_practice"}
    visible_text: {title: "Ctrl 組合鍵：複製、貼上、復原"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "hotspot", goal: "完成選取、複製、貼上、復原", trigger: "click", initial_state: "idle", states: [select, copy, blank, paste, undo], fallback: "五個步驟文字列出"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 9
    soil_phase: "action"
    role: "practice"
    learning_task: "用鍵盤完成登入"
    core_point: "Tab 換欄位、Enter 送出"
    semantic_structure: "practice"
    layout: {id: "action_next_step", variant: "fake_login"}
    visible_text: {title: "用鍵盤完成登入"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "quiz", goal: "整合大小寫、符號、Tab、Enter", trigger: "click", initial_state: "empty", states: [empty, wrong, success], fallback: "登入步驟文字列出"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 10
    soil_phase: "action"
    role: "sequence"
    learning_task: "知道符號小站怎麼玩"
    core_point: "四個步驟"
    semantic_structure: "sequence"
    layout: {id: "process_timeline", variant: "stepper"}
    visible_text: {title: "符號小站，四步驟"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "stepper", goal: "記得登入與練習流程", trigger: "click", initial_state: "step_1", states: [s1, s2, s3, s4], fallback: "四步驟全部列出"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
  - page: 11
    soil_phase: "action"
    role: "synthesis"
    learning_task: "回顧六個重點"
    core_point: "六件事"
    semantic_structure: "synthesis"
    layout: {id: "summary_three", variant: "reveal_cards"}
    visible_text: {title: "今天記住六件事"}
    speaker_only: "見 NOTES"
    visual: {mode: "native", brief: "", source: ""}
    interaction: {type: "reveal", goal: "自我檢查重點", trigger: "click", initial_state: "collapsed", states: [c1, c2, c3, c4, c5, c6], fallback: "六個重點全部展開"}
    accessibility: {keyboard: true, touch: true, reduced_motion: true}
